[package]
name = "blockmd"
version = "0.1.3"
description = "A Notion-style block editor whose files are just plain .md"
authors = ["Ruiquan Qiao"]
license = "MIT"
repository = "https://github.com/RuiquanQiao/BlockMD"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "blockmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
