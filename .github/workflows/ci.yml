name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fidelity is a blocking check. BlockMD's core promise is "open, save, SHA-256
# unchanged"; if that assertion fails the product premise no longer holds, so the
# merge does not proceed.
jobs:
  fidelity:
    name: Fidelity (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-OS is mandatory: CRLF, BOM and path separators all behave differently.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Fixtures and corpus must land on disk byte for byte; no EOL translation.
      - name: Disable git line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Fetch real-world corpus
        run: npm run corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: npm test
