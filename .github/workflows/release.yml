name: Release

# Publishing is tag-driven rather than push-driven: every commit on main would
# otherwise produce installers nobody asked for, and a release people download has to
# correspond to a version someone deliberately cut.
#
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release, created before any build starts. When each build job created
  # it on demand, jobs starting together each made their own: v0.1.5 had two drafts,
  # and the Intel Mac files went to the one nobody published. (A draft can't be found
  # by its tag, so tauri-action couldn't see that another job had already made it.)
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Reuse the draft on a re-run; otherwise create it. The id comes from the
          # create call itself: listing right after creating can lag (v0.1.6's first
          # run made the draft, then couldn't find it).
          id=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api --method POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f name="BlockMD $TAG" -F draft=true \
              -F body=@.github/release-notes.md --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  installers:
    name: ${{ matrix.label }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            args: ''
          - os: macos-latest
            label: macOS (Apple silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'

    steps:
      - uses: actions/checkout@v4

      - name: Disable git line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The fidelity suite gates the release the same way it gates a merge: an
      # installer that cannot open and re-save a file byte for byte is not shippable.
      - name: Fetch real-world corpus
        run: npm run corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: npm test

      # Signing is what lets installed copies update themselves: the updater only accepts
      # files signed by this key (public half in tauri.conf.json). Nothing reaches users
      # until the draft is published.
      #
      # latest.json, the manifest the app polls, is written by the `manifest` job below,
      # not here: when every matrix job merges itself into one shared asset, jobs that
      # finish together race. In v0.1.2 the Windows job lost that race and failed.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: ${{ matrix.args }}
          # Upload into the one draft made above (notes: .github/release-notes.md).
          releaseId: ${{ needs.draft.outputs.id }}

  # Runs once, after every platform has uploaded its signed bundle. Refuses to write a
  # manifest with a platform missing, so a half-built release can't strand anyone.
  manifest:
    name: Update manifest (latest.json)
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/updater-manifest.mjs "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
