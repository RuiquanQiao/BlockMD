name: Release

# Publishing is tag-driven rather than push-driven: every commit on main would
# otherwise produce installers nobody asked for, and a release people download has to
# correspond to a version someone deliberately cut.
#
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            args: ''
          - os: macos-latest
            label: macOS (Apple silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'

    steps:
      - uses: actions/checkout@v4

      - name: Disable git line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The fidelity suite gates the release the same way it gates a merge: an
      # installer that cannot open and re-save a file byte for byte is not shippable.
      - name: Fetch real-world corpus
        run: npm run corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: npm test

      # Signing is what lets installed copies update themselves: the updater only accepts
      # files signed by this key (public half in tauri.conf.json). tauri-action also
      # uploads latest.json, the manifest the app polls; each matrix job merges its
      # platform into it. Nothing reaches users until the draft is published.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'BlockMD ${{ github.ref_name }}'
          # Written as a draft so the notes can be edited before anyone sees it.
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Download the installer for your platform below. If you already have
            BlockMD 0.1.1 or later, it offers this update by itself when you open it.

            **Windows** — two installers are published and they register BlockMD
            identically; pick either. `-setup.exe` (NSIS) is the smaller one and the
            normal choice. `.msi` is for unattended or managed deployment
            (`msiexec /i BlockMD_x64_en-US.msi /qn`).

            Both register BlockMD as a handler for `.md` and `.markdown`. Windows will
            not let an installer take the default file association, so to get
            double-click opening: right-click any `.md` → Open with → Choose another
            app → BlockMD → *Always use this app*.

            Two things worth knowing before you install:

            - **The installer needs an internet connection** if the Microsoft Edge
              WebView2 runtime is not already present. It is preinstalled on Windows 11
              and on most Windows 10 machines. Bundling it offline would add ~130 MB to
              a 2 MB installer, which is not a trade we are willing to make.
            - **After uninstalling**, if you had set BlockMD as your default `.md` app,
              Windows may still point `.md` at it. That choice lives in a hash-protected
              per-user key that belongs to you, not to our uninstaller, so we do not
              touch it. Pick a new default under Settings → Apps → Default apps.

            **macOS** — the build is unsigned, so the first launch needs
            right-click → Open.
